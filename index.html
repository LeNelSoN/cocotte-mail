<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cocotte Mail – messagerie d'entraînement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--fs:17px;--blue:#1f4e8c;--blue-d:#163a69;--blue-l:#e8eff9;--bg:#f2f4f7;--line:#dce2ea;--txt:#1b2531;--mut:#5b6878;--red:#b42318;--red-l:#fdecea;--green:#1e7b45;--green-l:#e5f4eb;--yel:#fff3c4;--card:#fff;--sel:#dce8f8}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;font-family:'Atkinson Hyperlegible',system-ui,-apple-system,Segoe UI,sans-serif;color:var(--txt);background:var(--bg);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;line-height:1.45}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;color:inherit}
.ic{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.ic.sm{width:.95em;height:.95em}
.ic.xl{width:3.5rem;height:3.5rem;stroke-width:1.4;color:#b7c3d1}
.trainbar{background:var(--yel);border-bottom:1px solid #e9d480;padding:.3rem 1rem;font-size:.82rem;text-align:center}
header.top{display:flex;align-items:center;gap:.8rem;padding:.55rem 1rem;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:1.2rem;color:var(--blue);white-space:nowrap}
.brand .logo{width:2rem;height:2rem;border-radius:9px;background:var(--blue);display:grid;place-items:center;color:#fff}
.search{flex:1;max-width:560px;display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 .4rem 0 .9rem;color:var(--mut)}
.search:focus-within{border-color:var(--blue);background:#fff}
.search input{border:0;background:transparent;padding:.5rem .5rem;flex:1;outline:none;min-width:0;color:var(--txt)}
.hdr-tools{margin-left:auto;display:flex;align-items:center;gap:.3rem}
.iconbtn{background:none;border:1px solid transparent;border-radius:8px;padding:.35rem .55rem;display:inline-flex;align-items:center;gap:.35rem;white-space:nowrap}
.iconbtn:hover{background:var(--bg);border-color:var(--line)}
.avatar{width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.85rem;flex:none;letter-spacing:.02em}
.avatar.sm{width:1.8rem;height:1.8rem;font-size:.72rem}
.avatar.lg{width:4.5rem;height:4.5rem;font-size:1.6rem}
.me{display:flex;align-items:center;gap:.5rem;padding-left:.4rem;border-left:1px solid var(--line);margin-left:.3rem}
.me small{display:block;color:var(--mut);font-size:.75rem}
#menuBtn{display:none}
.layout{flex:1;display:grid;grid-template-columns:240px minmax(300px,410px) 1fr;min-height:0}
nav.side{padding:.8rem;overflow:auto;border-right:1px solid var(--line);background:var(--card)}
.compose-btn{width:100%;background:var(--blue);color:#fff;border:0;border-radius:14px;padding:.85rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:.5rem;margin-bottom:.8rem;box-shadow:0 2px 6px rgba(31,78,140,.25)}
.compose-btn:hover{background:var(--blue-d)}
.folder{display:flex;align-items:center;gap:.65rem;width:100%;background:none;border:0;border-radius:10px;padding:.5rem .7rem;text-align:left}
.folder span:first-of-type{white-space:normal;line-height:1.2;overflow-wrap:anywhere}
.folder:hover{background:var(--bg)}
.folder.active{background:var(--blue-l);color:var(--blue-d);font-weight:700}
.folder.add{color:var(--mut)}
.folder .count{margin-left:auto;font-size:.8rem;font-weight:700;background:var(--blue);color:#fff;border-radius:999px;padding:0 .45rem;min-width:1.5rem;text-align:center}
.folder .count.grey{background:#e3e8ee;color:var(--txt)}
.side h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:1.1rem .7rem .3rem}
.score{margin:1.2rem .3rem 0;padding:.7rem;border-radius:12px;background:var(--green-l);color:var(--green);font-size:.85rem;display:flex;gap:.5rem;align-items:flex-start}
#list{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--card)}
.l-head{display:flex;align-items:center;gap:.6rem;padding:.65rem .9rem;border-bottom:1px solid var(--line);min-height:3.2rem;flex-wrap:wrap}
.l-head h2{font-size:1.05rem;margin:0}
.l-head.bulk{background:var(--blue-l)}
.l-head .sp{flex:1}
.mut{color:var(--mut)}
.link{background:none;border:0;color:var(--blue);text-decoration:underline;padding:.2rem;font-size:.9rem}
.hint{font-size:.82rem;color:var(--mut);background:var(--bg);padding:.45rem .9rem;border-bottom:1px solid var(--line)}
.rows{overflow:auto;flex:1}
.row{display:grid;grid-template-columns:auto auto 1fr;gap:.25rem .5rem;align-items:start;padding:.6rem .8rem .6rem .7rem;border-bottom:1px solid var(--line);cursor:pointer;position:relative;outline:none}
.row:hover{background:#f7f9fb}
.row:focus-visible{box-shadow:inset 0 0 0 2px var(--blue)}
.row.sel{background:var(--sel)}
.row.checked{background:#eef3fb}
.row.unread::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
.row.unread .r-from,.row.unread .r-sub{font-weight:700}
.chk{width:1.1rem;height:1.1rem;margin:.25rem 0 0;accent-color:var(--blue);cursor:pointer}
.star{background:none;border:0;padding:.1rem;color:#9aa6b4;line-height:1}
.star:hover{color:#d4a017}
.star.on{color:#e0a800}
.star.on .ic{fill:#f5c518}
.r-main{min-width:0}
.r-top{display:flex;gap:.5rem;align-items:baseline}
.r-from{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-date{font-size:.8rem;color:var(--mut);white-space:nowrap}
.row.unread .r-date{color:var(--blue);font-weight:700}
.r-sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:.35rem;align-items:center}
.r-sub span{overflow:hidden;text-overflow:ellipsis}
.r-snip{font-size:.85rem;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.draftlbl{color:var(--red);font-weight:700}
.ftag{display:inline-block;font-size:.72rem;background:#e8ecf1;border-radius:6px;padding:0 .35rem;margin-top:.2rem;color:var(--mut)}
.empty-list{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);padding:2rem;text-align:center}
#reader{display:flex;flex-direction:column;min-height:0;background:var(--card)}
.r-bar{display:flex;flex-wrap:wrap;gap:.25rem;padding:.5rem .7rem;border-bottom:1px solid var(--line);align-items:center}
.tbtn{display:inline-flex;align-items:center;gap:.35rem;background:none;border:1px solid var(--line);border-radius:9px;padding:.35rem .65rem;font-size:.88rem;white-space:nowrap}
.tbtn:hover{background:var(--bg)}
.tbtn.danger{color:var(--red)}
.tbtn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.tbtn.primary:hover{background:var(--blue-d)}
.sep{width:1px;align-self:stretch;background:var(--line);margin:0 .2rem}
.mob-back{display:none}
.r-scroll{overflow:auto;flex:1;padding:1.3rem 1.8rem 2rem}
.subj{font-size:1.45rem;margin:0 0 1rem;line-height:1.25}
.mhdr{display:flex;gap:.8rem;align-items:flex-start;margin-bottom:1.2rem;flex-wrap:wrap}
.mhdr-info{flex:1;min-width:14rem}
.addr{color:var(--mut);font-size:.9rem;word-break:break-all}
.mhdr .date{font-size:.85rem;white-space:nowrap}
.inbanner{display:flex;gap:.6rem;align-items:flex-start;padding:.7rem .9rem;border-radius:10px;margin-bottom:1rem;font-size:.92rem}
.inbanner.warn{background:var(--red-l);color:#7a1a12}
.inbanner.info{background:var(--blue-l);color:var(--blue-d)}
.mbody{font-size:1rem;line-height:1.6;overflow-wrap:anywhere;max-width:46rem}
.mbody p{margin:0 0 .9em}
.mbody a{color:#1a5fb4;text-decoration:underline;cursor:pointer}
.mbody a.btnlink{display:inline-block;color:#fff;text-decoration:none;padding:.6rem 1.3rem;border-radius:6px;font-weight:700}
.mbody .quote{white-space:pre-wrap}
.atts{margin-top:1.6rem;border-top:1px solid var(--line);padding-top:1rem}
.attlist{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:.5rem}
.att{display:flex;flex-direction:column;align-items:flex-start;gap:.25rem;width:11rem;border:1px solid var(--line);border-radius:10px;padding:.5rem;background:#fff;text-align:left}
.att:hover{border-color:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.att img{width:100%;height:6rem;object-fit:cover;border-radius:6px;background:var(--bg)}
.att .thumb{width:100%;height:6rem;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:1.1rem;color:#fff}
.att-n{font-size:.85rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.att small{color:var(--mut)}
.quick{display:flex;gap:.6rem;margin-top:2rem;flex-wrap:wrap}
.quick .tbtn{padding:.6rem 1.1rem;font-size:.95rem}
.r-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);text-align:center;padding:2rem}
.contact-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.5rem;padding:2.5rem 1rem}
.contact-card h2{margin:.4rem 0 0}
.contact-card .btns{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;margin-top:1rem}
/* compose */
#composeRoot .compose{position:fixed;right:1.2rem;bottom:1.2rem;width:min(42rem,calc(100vw - 2rem));height:min(40rem,calc(100dvh - 2.4rem));background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(16,30,54,.28);display:flex;flex-direction:column;z-index:40;border:1px solid var(--line)}
.c-head{display:flex;align-items:center;justify-content:space-between;background:var(--blue);color:#fff;padding:.55rem .6rem .55rem 1rem;border-radius:14px 14px 0 0;font-weight:700}
.c-head .iconbtn{color:#fff}
.c-head .iconbtn:hover{background:rgba(255,255,255,.15);border-color:transparent}
.c-row{display:flex;align-items:center;gap:.5rem;border-bottom:1px solid var(--line);padding:0 .9rem;position:relative}
.c-row label{color:var(--mut);min-width:3.2rem;font-size:.92rem}
.c-row input{flex:1;border:0;outline:none;padding:.6rem 0;min-width:0;background:transparent}
.c-row:focus-within{background:#fafcff}
.c-row .help{font-size:.75rem;color:var(--mut);white-space:nowrap}
.ac{flex:1;position:relative;display:flex}
.sugg{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:5;overflow:hidden}
.sugg button{display:flex;gap:.6rem;align-items:center;width:100%;background:none;border:0;padding:.5rem .7rem;text-align:left}
.sugg button:hover{background:var(--blue-l)}
.sugg small{color:var(--mut)}
#cBody{flex:1;border:0;outline:none;resize:none;padding:.9rem;line-height:1.55;min-height:6rem}
.c-atts{display:flex;flex-wrap:wrap;gap:.4rem;padding:0 .9rem}
.c-atts:not(:empty){padding:.5rem .9rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.25rem .3rem .25rem .6rem;font-size:.85rem}
.chip button{background:none;border:0;padding:.1rem;border-radius:5px;display:flex}
.chip button:hover{background:#dfe5ec}
.c-foot{display:flex;gap:.5rem;align-items:center;padding:.7rem .9rem;border-top:1px solid var(--line);flex-wrap:wrap}
.c-foot .sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:.55rem 1rem;display:inline-flex;align-items:center;gap:.4rem}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700}
.btn.primary:hover{background:var(--blue-d)}
.btn.danger{color:var(--red);border-color:#f0c4bf}
.btn.danger:hover{background:var(--red-l)}
/* dialogs */
.overlay{position:fixed;inset:0;background:rgba(15,25,40,.45);display:grid;place-items:center;z-index:100;padding:1rem}
.dlg{background:#fff;border-radius:16px;max-width:30rem;width:100%;padding:1.4rem 1.5rem 1.2rem;box-shadow:0 20px 50px rgba(0,0,0,.3);max-height:calc(100dvh - 2rem);overflow:auto}
.dlg.wide{max-width:40rem}
.dlg h2{margin:0 0 .8rem;font-size:1.25rem}
.dlg-body p{margin:.4rem 0 .7rem}
.dlg-body ul{padding-left:1.2rem;margin:.3rem 0 .8rem}
.dlg-body li{margin-bottom:.35rem}
.dlg-btns{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:flex-end;margin-top:1rem}
.field{width:100%;border:1px solid #c7d0db;border-radius:10px;padding:.6rem .75rem;margin:.2rem 0 .8rem;background:#fff}
.field:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
textarea.field{resize:vertical;min-height:5rem}
.dlg label{font-weight:700;font-size:.92rem}
.okbox{background:var(--green-l);color:#14532d;padding:.7rem .9rem;border-radius:10px}
.alertbox{background:var(--red-l);color:#7a1a12;padding:.7rem .9rem;border-radius:10px}
.docpage{background:#fff;border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.08);padding:1.6rem;white-space:pre-wrap;font-family:Georgia,serif;font-size:.95rem;line-height:1.6;max-height:55vh;overflow:auto}
.preview-img{width:100%;border-radius:10px;display:block}
.docpick{display:flex;align-items:center;gap:.7rem;width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:.55rem .7rem;margin-bottom:.45rem;text-align:left}
.docpick:hover{border-color:var(--blue);background:var(--blue-l)}
.docpick .thumb{width:2.6rem;height:2.6rem;border-radius:6px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.7rem;flex:none;overflow:hidden}
.docpick .thumb img{width:100%;height:100%;object-fit:cover}
.gloss dt{font-weight:700;margin-top:.6rem}
.gloss dd{margin:0 0 .2rem 0;color:#333}
/* pop menu */
.pop{position:fixed;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:90;padding:.3rem;min-width:13rem}
.pop button{display:flex;align-items:center;gap:.6rem;width:100%;background:none;border:0;padding:.5rem .7rem;border-radius:8px;text-align:left}
.pop button:hover{background:var(--blue-l)}
.pop hr{border:0;border-top:1px solid var(--line);margin:.3rem 0}
/* toast & status */
#toasts{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);display:flex;flex-direction:column;gap:.5rem;z-index:120;align-items:center;pointer-events:none}
.toast{background:#1b2531;color:#fff;border-radius:12px;padding:.65rem 1rem;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:.8rem;align-items:center;pointer-events:auto;animation:tin .25s ease}
.toast button{background:none;border:0;color:#9cc3ff;font-weight:700;text-decoration:underline;padding:0}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#status{position:fixed;left:0;bottom:0;background:#f3f4f6;border:1px solid #c9ced6;border-left:0;border-bottom:0;border-radius:0 8px 0 0;padding:.2rem .7rem;font-size:.8rem;font-family:ui-monospace,Menlo,Consolas,monospace;z-index:130;max-width:80vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:none}
/* onboarding */
.onb{position:fixed;inset:0;background:linear-gradient(135deg,#1f4e8c,#2f6db5);display:grid;place-items:center;z-index:200;padding:1rem}
.onb .card{background:#fff;border-radius:20px;padding:2rem;max-width:28rem;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.onb h1{margin:.6rem 0 .3rem;font-size:1.5rem}
.onb .preview{background:var(--blue-l);border-radius:10px;padding:.6rem .8rem;margin:.3rem 0 1.2rem;font-weight:700;color:var(--blue-d);word-break:break-all}
.drawer-bg{display:none}
.exo .exn{width:1.55rem;height:1.55rem;border-radius:50%;background:#e3e8ee;display:grid;place-items:center;font-size:.8rem;font-weight:700;flex:none}
.exo span:last-child{white-space:normal!important;font-size:.92rem;line-height:1.25}
.exo.done{color:var(--green)}
.exo.done .exn{background:var(--green);color:#fff}
.modes{margin:.2rem 0 1.1rem}
.modes label{display:flex;gap:.6rem;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:.55rem .7rem;margin-top:.4rem;cursor:pointer;font-weight:400}
.modes label:has(input:checked){border-color:var(--blue);background:var(--blue-l)}
.modes input{margin-top:.3rem;accent-color:var(--blue)}
.meter{height:8px;background:#e3e8ee;border-radius:99px;overflow:hidden}
.meter span{display:block;height:100%;width:0;transition:width .2s,background .2s}
.crit{list-style:none;padding:0!important;margin:.2rem 0 .9rem!important;font-size:.88rem;color:var(--red)}
.crit li{margin:.15rem 0!important}
.crit li.ok{color:var(--green)}

/* ---------- apparences (aucun logo ni nom de marque) ---------- */
body[data-theme=gmail]{--blue:#0b57d0;--blue-d:#0842a0;--blue-l:#d3e3fd;--bg:#f6f8fc;--sel:#c2e7ff;font-family:Roboto,Arial,sans-serif}
body[data-theme=gmail] header.top,body[data-theme=gmail] nav.side{background:#f6f8fc;border-color:#f6f8fc}
body[data-theme=gmail] .search{background:#e9eef6;border-color:#e9eef6}
body[data-theme=gmail] .compose-btn{background:#c2e7ff;color:#001d35;border-radius:16px;box-shadow:none;justify-content:flex-start;padding:1rem 1.4rem;width:auto}
body[data-theme=gmail] .compose-btn:hover{background:#b3dcf7;box-shadow:0 1px 3px rgba(0,0,0,.2)}
body[data-theme=gmail] .folder{border-radius:0 999px 999px 0}
body[data-theme=gmail] .folder.active{background:#d3e3fd;color:#041e49}
body[data-theme=gmail] .layout{grid-template-columns:256px 1fr}
body[data-theme=gmail] #list{border-radius:16px 16px 0 0;margin-right:1rem}
body[data-theme=gmail] #reader{display:none;border-radius:16px 16px 0 0;margin-right:1rem}
body[data-theme=gmail].reading #reader{display:flex}
body[data-theme=gmail].reading #list{display:none}
body[data-theme=gmail] .mob-back{display:inline-flex}
body[data-theme=outlook]{--blue:#0f6cbd;--blue-d:#115ea3;--blue-l:#ebf3fc;--bg:#f5f5f5;--sel:#cfe4fa;font-family:'Segoe UI',Arial,sans-serif}
body[data-theme=outlook] header.top{background:#0f6cbd;border-color:#0f6cbd;color:#fff}
body[data-theme=outlook] .brand,body[data-theme=outlook] .hdr-tools .iconbtn,body[data-theme=outlook] .me small{color:#fff}
body[data-theme=outlook] .brand .logo{background:#fff;color:#0f6cbd}
body[data-theme=outlook] .hdr-tools .iconbtn:hover{background:rgba(255,255,255,.15);border-color:transparent}
body[data-theme=outlook] .search{background:#fff}
body[data-theme=outlook] .compose-btn{border-radius:4px;box-shadow:none}
body[data-theme=outlook] .folder{border-radius:4px}
body[data-theme=outlook] .folder.active{background:#ebf3fc;box-shadow:inset 3px 0 0 #0f6cbd}
body[data-theme=orange]{--blue:#ff7900;--blue-d:#e06a00;--blue-l:#fff1e5;--bg:#f4f4f4;--sel:#ffe2c7;font-family:Helvetica,Arial,sans-serif}
body[data-theme=orange] header.top{background:#000;border-color:#000;color:#fff}
body[data-theme=orange] .brand,body[data-theme=orange] .hdr-tools .iconbtn,body[data-theme=orange] .me small{color:#fff}
body[data-theme=orange] .brand .logo{background:#ff7900;color:#000}
body[data-theme=orange] .hdr-tools .iconbtn:hover{background:rgba(255,255,255,.15);border-color:transparent}
body[data-theme=orange] .search{background:#fff}
body[data-theme=orange] .compose-btn,body[data-theme=orange] .btn.primary,body[data-theme=orange] .tbtn.primary{color:#000}
body[data-theme=orange] .compose-btn{border-radius:0;box-shadow:none;font-weight:700}
body[data-theme=orange] .folder{border-radius:0}
body[data-theme=orange] .folder.active{background:#fff1e5;color:#000;box-shadow:inset 4px 0 0 #ff7900}
body[data-theme=orange] .c-head{background:#000}
body[data-theme=laposte]{--blue:#003da5;--blue-d:#002e7d;--blue-l:#e6edf8;--bg:#f2f4f8;--sel:#d6e1f3;font-family:Arial,sans-serif}
body[data-theme=laposte] header.top{background:#003da5;border-color:#003da5;color:#fff}
body[data-theme=laposte] .brand,body[data-theme=laposte] .hdr-tools .iconbtn,body[data-theme=laposte] .me small{color:#fff}
body[data-theme=laposte] .brand .logo{background:#ffc800;color:#003da5}
body[data-theme=laposte] .hdr-tools .iconbtn:hover{background:rgba(255,255,255,.15);border-color:transparent}

/* ---------- page « Présentation de la séance » (#seance) ---------- */
.seance{position:fixed;inset:0;z-index:300;background:#fff;overflow:auto;display:flex;flex-direction:column;font-size:clamp(14px,1.3vw,26px)}
.seance .s-top{background:var(--blue);color:#fff;padding:1em 1.6em;display:flex;align-items:center;gap:.8em}
.seance .s-top .logo{width:2.2em;height:2.2em;border-radius:.5em;background:#fff;color:var(--blue);display:grid;place-items:center;flex:none}
.seance .s-top .logo .ic{width:1.4em;height:1.4em}

.seance .s-goal{margin:.2em 0 0;font-size:1.05em;opacity:.95}

.seance h2{font-size:1.15em;margin:0 0 .6em;color:var(--blue-d)}
.seance .s-obj{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.55em}
.seance .s-obj li{display:flex;align-items:center;gap:.7em;background:var(--blue-l);border-radius:.6em;padding:.6em .8em;font-size:1.05em}
.seance .s-obj .ic{width:1.5em;height:1.5em;color:var(--blue);flex:none}
.seance .s-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.35em}
.seance .s-steps li{display:grid;grid-template-columns:2em 1fr auto;align-items:center;gap:.6em;border:2px solid var(--line);border-radius:.6em;padding:.3em .7em}
.seance .s-steps .n{width:1.7em;height:1.7em;border-radius:50%;background:#e3e8ee;display:grid;place-items:center;font-weight:700;font-size:.85em}
.seance .s-steps small{display:block;color:var(--mut);font-size:.8em}
.seance .s-steps .d{font-weight:700;color:var(--mut);white-space:nowrap}
.seance .s-steps li.pause{background:#f4f5f7;color:var(--mut);font-style:italic}
.seance .s-steps li.done{opacity:.5}
.seance .s-steps li.done .n{background:var(--green);color:#fff}
.seance .s-steps li.cur{border-color:var(--blue);background:var(--blue-l);box-shadow:0 0 0 3px var(--blue-l);font-weight:700}
.seance .s-steps li.cur .n{background:var(--blue);color:#fff}
.seance .s-foot{margin-left:auto;display:flex;gap:.5em;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.seance .s-foot .btn{font-size:.8em;color:var(--txt)}
.seance .s-foot .btn.primary{background:#fff;color:var(--blue-d);border-color:#fff}
@media (max-width:800px){.seance .s-main{grid-template-columns:1fr}}

/* ---------- helpers ---------- */
function colorFor(s){const C=['#1f4e8c','#b54708','#1e7b45','#7a2e98','#b42318','#0e7490','#9a3412','#4338ca'];let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return C[h%C.length]}
function initials(n){const p=String(n||'?').replace(/[^\p{L}\p{N}\s]/gu,'').trim().split(/\s+/);return(((p[0]||'?')[0]||'?')+(p[1]?p[1][0]:'')).toUpperCase()}
const avatar=(name,email,c='')=>`<span class="avatar ${c}" style="background:${colorFor(email||name)}">${esc(initials(name||email))}</span>`;
function contactOf(a){a=String(a).toLowerCase();return S.contacts.find(c=>c.email.toLowerCase()===a)}
function nameOf(a){if(String(a).toLowerCase()===me())return 'moi';const c=contactOf(a);return c?c.name:a}
function plain(m){if(m.text!=null)return m.text;const d=document.createElement('div');d.innerHTML=fill(m.html||'').replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|li|div)>/gi,'\n').replace(/<li>/gi,'• ');return d.textContent.replace(/\n{3,}/g,'\n\n').trim()}
function bodyHtml(m){if(m.html)return fill(m.html);return '<div class="quote">'+esc(m.text||'')+'</div>'}
function fmtShort(t){const d=new Date(t),n=new Date();if(d.toDateString()===n.toDateString())return d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});const y=new Date(n);y.setDate(n.getDate()-1);if(d.toDateString()===y.toDateString())return 'Hier';return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}
function fmtFull(t){const d=new Date(t);return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const splitAddr=s=>String(s||'').split(/[,;]+/).map(x=>x.trim()).filter(Boolean);
const validAddr=a=>/^[^\s@,;<>]+@[^\s@,;<>]+\.[a-z]{2,}$/i.test(a);

/* ---------- apparences ---------- */
const THEMES={
 classique:{label:'Classique (Cocotte Mail)',compose:'Nouveau message',f:{inbox:'Boîte de réception',starred:'Favoris',sent:'Envoyés',drafts:'Brouillons',spam:'Indésirables',trash:'Corbeille'}},
 gmail:{label:'Ressemble à Gmail',compose:'Nouveau message',f:{inbox:'Boîte de réception',starred:'Messages suivis',sent:'Messages envoyés',drafts:'Brouillons',spam:'Spam',trash:'Corbeille'}},
 outlook:{label:'Ressemble à Outlook',compose:'Nouveau courrier',f:{inbox:'Boîte de réception',starred:'Favoris',sent:'Éléments envoyés',drafts:'Brouillons',spam:'Courrier indésirable',trash:'Éléments supprimés'}},
 orange:{label:'Ressemble à Mail Orange',compose:'Écrire',f:{inbox:'Boîte de réception',starred:'Favoris',sent:'Envoyés',drafts:'Brouillons',spam:'Indésirables',trash:'Corbeille'}},
 laposte:{label:'Ressemble à laposte.net',compose:'Écrire',f:{inbox:'Boîte de réception',starred:'Favoris',sent:'Envoyés',drafts:'Brouillons',spam:'Spam',trash:'Corbeille'}}
};
const TH=()=>THEMES[(S&&S.theme)||'classique']||THEMES.classique;
const themeOptions=cur=>Object.entries(THEMES).map(([k,t])=>`<option value="${k}" ${k===cur?'selected':''}>${t.label}</option>`).join('');
function tt(h){return String(h).replace(/\{(sent|drafts|spam|trash|inbox)\}/g,(_,k)=>TH().f[k]).replace(/\{compose\}/g,TH().compose)}
function folderLabel(f){return f==='contacts'?'Contacts':(TH().f[f]||String(f).slice(2))}
function inFolder(f){if(f==='starred')return S.messages.filter(m=>m.starred&&m.folder!=='trash');return S.messages.filter(m=>m.folder===f)}
const unreadIn=f=>inFolder(f).filter(m=>!m.read).length;
function prefix(p,s){s=String(s||'').replace(/^((re|tr|fwd?)\s*:\s*)+/i,'');return p+' : '+s}

/* ---------- toast / dialog / menus ---------- */
function toast(msg,action,dur){const t=document.createElement('div');t.className='toast';t.innerHTML=`<span>${msg}</span>`;if(action){const b=document.createElement('button');b.textContent=action.label;b.onclick=()=>{action.fn();t.remove()};t.appendChild(b)}$('#toasts').appendChild(t);setTimeout(()=>t.remove(),dur||(action?7000:3500))}
function dialog({title,body='',buttons,wide=false}){
 buttons=buttons||[{label:'OK',value:true,primary:true}];
 return new Promise(res=>{
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="dlg ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title.replace(/<[^>]+>/g,''))}"><h2>${title}</h2><div class="dlg-body">${body}</div><div class="dlg-btns"></div></div>`;
  const bx=ov.querySelector('.dlg-btns');
  const close=v=>{dialog.vals=Object.fromEntries([...ov.querySelectorAll('[name]')].map(i=>[i.name,i.value]));ov.remove();res(v)};
  buttons.forEach(b=>{const e=document.createElement('button');e.className='btn'+(b.primary?' primary':'')+(b.danger?' danger':'');e.textContent=b.label;e.onclick=()=>close(b.value);bx.appendChild(e)});
  ov.addEventListener('mousedown',e=>{if(e.target===ov)close(null)});
  ov.addEventListener('click',e=>{const t=e.target.closest('[data-val]');if(t)close(t.dataset.val)});
  ov.addEventListener('keydown',e=>{if(e.key==='Escape')close(null);if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();const p=bx.querySelector('.primary');p&&p.click()}});
  document.body.appendChild(ov);
  const f=ov.querySelector('input,textarea')||bx.querySelector('.primary')||bx.querySelector('button');f&&f.focus();
 });
}
let popEl=null;
function closePop(){if(popEl){popEl.remove();popEl=null;document.removeEventListener('mousedown',popOutside)}}
function popOutside(e){if(popEl&&!popEl.contains(e.target))closePop()}
function popMenu(anchor,items){
 closePop();const r=anchor.getBoundingClientRect();const d=document.createElement('div');d.className='pop';
 d.innerHTML=items.map((it,i)=>it==='-'?'<hr>':`<button data-i="${i}">${it.label}</button>`).join('');
 document.body.appendChild(d);popEl=d;
 let left=Math.max(8,Math.min(r.left,innerWidth-d.offsetWidth-8)),top=r.bottom+4;
 if(top+d.offsetHeight>innerHeight-8)top=Math.max(8,r.top-d.offsetHeight-4);
 d.style.left=left+'px';d.style.top=top+'px';
 d.onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;const it=items[+b.dataset.i];closePop();it.fn()};
 setTimeout(()=>document.addEventListener('mousedown',popOutside),0);
}

/* ---------- rendering ---------- */
function render(){if(!S)return;renderHeader();renderSide();renderList();renderReader();const u=unreadIn('inbox');document.title=(u?`(${u}) `:'')+"Cocotte Mail – messagerie d'entraînement"}
function renderHeader(){
 $('#me').innerHTML=`${avatar(S.user.name,S.user.email)}<div><b>${esc(S.user.name)}</b><small>${esc(S.user.email)}</small></div>`;
}
function renderSide(){
 const items=[['inbox','inbox'],['starred','star'],['sent','send'],['drafts','draft'],['spam','spam'],['trash','trash']];
 document.body.dataset.theme=(S&&S.theme)||'classique';
 let h=`<button class="compose-btn" data-act="compose">${ic('pen')} ${TH().compose}</button>`;
 h+=items.map(([f,i])=>{let n=0,g='';if(f==='inbox'||f==='spam')n=unreadIn(f);if(f==='drafts'){n=inFolder(f).length;g=' grey'}return `<button class="folder ${V.folder===f?'active':''}" data-folder="${f}">${ic(i)}<span>${folderLabel(f)}</span>${n?`<span class="count${g}">${n}</span>`:''}</button>`}).join('');
 h+=`<h4>Mes dossiers</h4>`+S.folders.map(n=>{const f='f:'+n,u=unreadIn(f);return `<button class="folder ${V.folder===f?'active':''}" data-folder="${esc(f)}">${ic('folder')}<span>${esc(n)}</span>${u?`<span class="count">${u}</span>`:''}</button>`}).join('')+`<button class="folder add" data-act="newfolder">${ic('plus')}<span>Nouveau dossier</span></button>`;
 h+=`<h4>Carnet d'adresses</h4><button class="folder ${V.folder==='contacts'?'active':''}" data-folder="contacts">${ic('users')}<span>Contacts</span><span class="count grey">${S.contacts.length}</span></button>`;

function openMsg(id){
 const m=byId(id);if(!m)return;
 onOpen(m);
 if(m.folder==='drafts'){openCompose({draftId:m.id,to:m.to.join(', '),cc:m.cc.join(', '),bcc:(m.bcc||[]).join(', '),subject:m.subject,text:m.text!=null?m.text:plain(m),attachments:m.attachments,title:'Brouillon'});return}
 m.read=true;V.sel=id;document.body.classList.add('reading');save();render();
 const sc=$('#reader .r-scroll');if(sc)sc.scrollTop=0;

function delMsgs(ids){
 const ms=ids.map(byId).filter(Boolean);if(!ms.length)return;
 if(ms.every(m=>m.folder==='trash')){purge(ids);return}
 ms.forEach(m=>{if(m.folder!=='trash'){m.prev=m.folder;m.folder='trash'}});
 if(ids.includes(V.sel)){V.sel=null;document.body.classList.remove('reading')}
 V.checked.clear();save();render();
 toast(ms.length>1?`${ms.length} messages mis à la corbeille`:'Message mis à la corbeille',{label:'Annuler',fn:()=>{ms.forEach(m=>{m.folder=m.prev||'inbox'});save();render()}});
}
async function purge(ids){
 const n=ids.length;
 const ok=await dialog({title:'Supprimer définitivement ?',body:`<p>${n>1?`Ces ${n} messages seront effacés`:'Ce message sera effacé'} pour toujours. Vous ne pourrez plus ${n>1?'les':'le'} récupérer.</p>`,buttons:[{label:'Annuler',value:false},{label:'Supprimer définitivement',value:true,danger:true}]});
 if(!ok)return;
 S.messages=S.messages.filter(m=>!ids.includes(m.id));
 if(ids.includes(V.sel)){V.sel=null;document.body.classList.remove('reading')}
 V.checked.clear();save();render();toast(n>1?`${n} messages supprimés`:'Message supprimé');
}
function moveTo(ids,folder){
 ids.map(byId).filter(Boolean).forEach(m=>{m.folder=folder});
 if(ids.includes(V.sel)&&V.folder!=='starred'&&!V.q){V.sel=null;document.body.classList.remove('reading')}
 V.checked.clear();save();render();toast(`Déplacé dans « ${esc(folderLabel(folder))} »`);
}
function moveMenu(anchor,ids){
 const cur=ids.length===1?byId(ids[0]).folder:null;
 const targets=['inbox',...S.folders.map(n=>'f:'+n)].filter(f=>f!==cur);
 const items=targets.map(f=>({label:ic(f==='inbox'?'inbox':'folder')+' '+esc(folderLabel(f)),fn:()=>moveTo(ids,f)}));
 if(items.length)items.push('-');
 items.push({label:ic('plus')+' Nouveau dossier…',fn:async()=>{const n=await newFolder();if(n)moveTo(ids,'f:'+n)}});
 popMenu(anchor,items);
}

 if(!r)return null;
 const n=(dialog.vals.nf||'').trim();
 if(!n){toast('Le nom du dossier est vide');return null}
 if(S.folders.some(x=>x.toLowerCase()===n.toLowerCase())){toast('Ce dossier existe déjà');return n}

async function report(m){
 if(m.phishing){
  if(!S.found.includes(m.id))S.found.push(m.id);
  const moved=m.folder!=='spam';
  if(moved){m.prev=m.folder;m.folder='spam';V.sel=null;document.body.classList.remove('reading')}
  save();render();
  await dialog({title:'Bien vu ! 🛡️',wide:true,body:`<p class="okbox">C'était bien une <b>tentative d'arnaque</b> (on parle d'« hameçonnage »).${moved?' Le message a été déplacé dans les indésirables.':''}</p><p><b>Les indices qui le prouvent :</b></p><ul>${m.clues.map(c=>`<li>${esc(c)}</li>`).join('')}</ul><p class="mut">Dans la vraie vie, vous pouvez aussi signaler ce type de message sur signal-spam.fr.</p>`,buttons:[{label:'Super, compris !',value:true,primary:true}]});
  if(m.ex)completeEx(m.ex);
 }else{
  const r=await dialog({title:'Ce message semble fiable',body:`<p>${esc(m.legit||"Ce message ne présente pas les signes habituels d'une arnaque : il ne réclame ni argent ni mot de passe et ne vous met pas la pression.")}</p><p class="mut">Vous pouvez quand même le ranger dans les indésirables si vous ne voulez plus le voir.</p>`,buttons:[{label:'Le déplacer dans Indésirables',value:true},{label:'Le garder',value:false,primary:true}]});
  if(r){m.prev=m.folder;moveTo([m.id],'spam')}
 }
}
async function notSpam(m){
 if(m.phishing){
  const r=await dialog({title:'⚠️ Attention, ce message est une arnaque',wide:true,body:`<p class="alertbox">Ce message a été classé dans les indésirables pour une bonne raison.</p><p><b>Les indices :</b></p><ul>${m.clues.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`,buttons:[{label:'Le déplacer quand même',value:true},{label:'Le laisser dans les indésirables',value:false,primary:true}]});
  if(!r){if(!S.found.includes(m.id)){S.found.push(m.id);save();renderSide()}return}
 }

}

}

/* ---------- compose ---------- */
let C=null;
function sigBlock(){return S.user.signature?'\n\n'+S.user.signature:''}
function quote(m){return `\n\nLe ${fmtFull(m.date)}, ${m.from.name||m.from.email} <${m.from.email}> a écrit :\n`+plain(m).split('\n').map(l=>'> '+l).join('\n')}
function reply(m,all){
 const mm=me(),fromMe=m.from.email.toLowerCase()===mm;
 let to=fromMe?m.to.slice():[m.from.email],cc=[];
 if(all){const fl=m.from.email.toLowerCase();to=to.concat(m.to.filter(a=>a.toLowerCase()!==mm&&a.toLowerCase()!==fl&&!to.includes(a)));cc=m.cc.filter(a=>a.toLowerCase()!==mm)}
 openCompose({to:to.join(', '),cc:cc.join(', '),subject:prefix('RE',m.subject),text:'\n'+sigBlock()+quote(m),title:all?'Répondre à tous':'Répondre',focus:'body',kind:all?'replyall':'reply',src:m.id});
}
function forward(m){
 openCompose({subject:prefix('TR',m.subject),text:'\n'+sigBlock()+`\n\n---------- Message transféré ----------\nDe : ${m.from.name||''} <${m.from.email}>\nDate : ${fmtFull(m.date)}\nObjet : ${m.subject||''}\nÀ : ${m.to.join(', ')}\n\n`+plain(m),attachments:m.attachments,title:'Transférer',focus:'to',kind:'fwd',src:m.id});
}
function openCompose(p={}){
 if(C&&C.dirty)saveDraft(true);
 C={draftId:p.draftId||null,to:p.to||'',cc:p.cc||'',bcc:p.bcc||'',subject:p.subject||'',text:p.text!=null?p.text:sigBlock(),atts:(p.attachments||[]).map(a=>Object.assign({},a)),showCc:!!(p.cc||p.bcc),dirty:false,title:p.title||TH().compose,focus:p.focus||'to',kind:p.kind||(p.draftId?'draft':'new'),src:p.src||null};
 closeDrawer();renderCompose();
}
function renderCompose(){
 const root=$('#composeRoot');
 if(!C){root.innerHTML='';return}
 root.innerHTML=`<div class="compose" role="dialog" aria-label="${esc(C.title)}">
 <div class="c-head"><span>${esc(C.title)}</span><button class="iconbtn" data-c="close" title="Fermer" aria-label="Fermer">${ic('x')}</button></div>
 <div class="c-row"><label for="cTo">À</label><div class="ac"><input id="cTo" autocomplete="off" spellcheck="false" placeholder="Adresse du destinataire, ou tapez un nom"><div class="sugg" hidden></div></div><button class="link" data-c="cc" title="Ajouter des destinataires en copie">Cc / Cci</button></div>
 <div class="c-row ccrow" ${C.showCc?'':'hidden'}><label for="cCc">Cc</label><div class="ac"><input id="cCc" autocomplete="off" spellcheck="false"><div class="sugg" hidden></div></div><span class="help">copie visible par tous</span></div>
 <div class="c-row ccrow" ${C.showCc?'':'hidden'}><label for="cBcc">Cci</label><div class="ac"><input id="cBcc" autocomplete="off" spellcheck="false"><div class="sugg" hidden></div></div><span class="help">copie cachée</span></div>
 <div class="c-row"><label for="cSub">Objet</label><input id="cSub" placeholder="De quoi parle votre message ?"></div>
 <textarea id="cBody" aria-label="Texte du message" placeholder="Écrivez votre message ici…"></textarea>
 <div class="c-atts" id="cAtts"></div>
 <div class="c-foot"><button class="btn primary" data-c="send">${ic('send')} Envoyer</button><button class="btn" data-c="attach">${ic('clip')} Joindre un fichier</button><span class="sp"></span><button class="btn" data-c="draft" title="Enregistrer dans les brouillons">Enregistrer</button><button class="iconbtn" data-c="discard" title="Supprimer ce message" aria-label="Supprimer ce message" style="color:var(--red)">${ic('trash')}</button></div>
 <input type="file" id="cFile" multiple hidden></div>`;
 $('#cTo').value=C.to;$('#cCc').value=C.cc;$('#cBcc').value=C.bcc;$('#cSub').value=C.subject;$('#cBody').value=C.text;
 ['#cTo','#cCc','#cBcc','#cSub','#cBody'].forEach(s=>$(s).addEventListener('input',()=>{C.dirty=true}));
 ['#cTo','#cCc','#cBcc'].forEach(s=>bindAC($(s)));
 $('#cFile').addEventListener('change',e=>{addFiles(e.target.files);e.target.value=''});
 renderAtts();
 if(C.focus==='body'){const b=$('#cBody');b.focus();b.setSelectionRange(0,0);b.scrollTop=0}else $('#cTo').focus();
}
function readFields(){if(!C||!$('#cTo'))return;C.to=$('#cTo').value;C.cc=$('#cCc').value;C.bcc=$('#cBcc').value;C.subject=$('#cSub').value;C.text=$('#cBody').value}
function renderAtts(){const el=$('#cAtts');if(!el)return;el.innerHTML=C.atts.map((a,i)=>`<span class="chip">${ic('clip','sm')} ${esc(a.name)} <small class="mut">${esc(a.size||'')}</small><button data-rmatt="${i}" title="Retirer la pièce jointe" aria-label="Retirer ${esc(a.name)}">${ic('x','sm')}</button></span>`).join('')}
function fmtSize(b){if(b<1024)return b+' o';if(b<1048576)return Math.round(b/1024)+' Ko';return(b/1048576).toFixed(1).replace('.',',')+' Mo'}
function addFiles(list){
 [...list].forEach(f=>{
  const a={name:f.name,size:fmtSize(f.size),type:f.type.startsWith('image/')?'image':'doc',user:true};
  if(f.size>10*1048576){dialog({title:'Fichier trop lourd',body:`<p>« ${esc(f.name)} » pèse ${fmtSize(f.size)}. La plupart des messageries refusent les pièces jointes de plus de 10 à 25 Mo.</p><p>Pour les gros fichiers, on utilise plutôt un service d'envoi de fichiers.</p>`});return}
  C.atts.push(a);C.dirty=true;renderAtts();
  if(a.type==='image'&&f.size<1.5*1048576){const r=new FileReader();r.onload=()=>{a.data=r.result};r.readAsDataURL(f)}
  else if(/^text\//.test(f.type)&&f.size<200000){const r=new FileReader();r.onload=()=>{a.preview=String(r.result).slice(0,5000)};r.readAsText(f)}
 });
 toast('Pièce jointe ajoutée');
}
async function pickDoc(){
 const v=await dialog({title:'Mes documents',body:`<p class="mut">Choisissez un fichier à joindre :</p>`+MYDOCS.map((d,i)=>`<button class="docpick" data-val="${i}"><span class="thumb" style="background:${EXTCOL[ext(d.name)]||'#607080'}">${d.type==='image'?`<img src="${esc(d.data)}" alt="">`:esc(ext(d.name).toUpperCase())}</span><span><b>${esc(d.name)}</b><br><small class="mut">${esc(d.size)}</small></span></button>`).join(''),buttons:[{label:'Annuler',value:null}]});
 if(v==null||v===false||!MYDOCS[+v])return;
 C.atts.push(Object.assign({},MYDOCS[+v]));C.dirty=true;renderAtts();toast('Pièce jointe ajoutée');
}
function bindAC(inp){
 const box=inp.nextElementSibling;
 const upd=()=>{const parts=inp.value.split(/[,;]/);const last=norm(parts[parts.length-1].trim());if(!last){box.hidden=true;return}
  const list=S.contacts.filter(c=>norm(c.name).includes(last)||c.email.toLowerCase().includes(last)).slice(0,6);
  if(!list.length){box.hidden=true;return}
  box.innerHTML=list.map(c=>`<button type="button" data-em="${esc(c.email)}">${avatar(c.name,c.email,'sm')}<span><b>${esc(c.name)}</b><br><small>${esc(c.email)}</small></span></button>`).join('');box.hidden=false};
 inp.addEventListener('input',upd);
 inp.addEventListener('blur',()=>setTimeout(()=>{box.hidden=true},150));
 inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!box.hidden){const b=box.querySelector('[data-em]');if(b){e.preventDefault();pick(b.dataset.em)}}if(e.key==='Escape')box.hidden=true});
 const pick=em=>{const parts=inp.value.split(/[,;]/);parts[parts.length-1]=em;inp.value=parts.map(s=>s.trim()).filter(Boolean).join(', ')+', ';box.hidden=true;C.dirty=true;inp.focus()};
 box.addEventListener('mousedown',e=>{const b=e.target.closest('[data-em]');if(!b)return;e.preventDefault();pick(b.dataset.em)});
}
function badReason(a){
 if(!a.includes('@'))return "il manque l'arobase @";
 if((a.match(/@/g)||[]).length>1)return "il y a plusieurs @ (une adresse n'en contient qu'un seul)";
 if(/\s/.test(a))return "il ne doit pas y avoir d'espace";
 const d=a.split('@')[1]||'';
 if(!d)return "il manque la partie après le @ (le fournisseur, par exemple cocotte-mail.fr)";
 if(!/\.[a-z]{2,}$/i.test(d))return "il manque la fin de l'adresse, après un point (par exemple .fr ou .com)";
 if(!a.split('@')[0])return "il manque la partie avant le @";
 return "l'adresse contient des caractères non autorisés";
}
async function sendMail(){
 readFields();
 const to=splitAddr(C.to),cc=splitAddr(C.cc),bcc=splitAddr(C.bcc);
 if(!to.length&&!cc.length&&!bcc.length){await dialog({title:'À qui envoyer ?',body:"<p>Indiquez au moins une adresse dans le champ <b>À</b>.</p><p class='mut'>Astuce : si la personne est dans vos contacts, tapez le début de son nom et choisissez-la dans la liste.</p>"});$('#cTo')&&$('#cTo').focus();return}
 const bad=[...to,...cc,...bcc].filter(a=>!validAddr(a));
 if(bad.length){await dialog({title:'Adresse incorrecte',body:`<p>${bad.length>1?'Ces adresses ne sont pas valides':"Cette adresse n'est pas valide"} :</p><ul>${bad.map(a=>`<li><b>${esc(a)}</b> : ${badReason(a)}</li>`).join('')}</ul><p>Une adresse s'écrit toujours comme ceci : <b>prenom.nom@fournisseur.fr</b></p>${bad.some(a=>!a.includes('@'))?"<p class='mut'>Si c'est le nom d'un contact, tapez le début de son nom puis cliquez dessus dans la liste qui apparaît.</p>":''}`});return}
 if(!C.subject.trim()){const r=await dialog({title:'Message sans objet',body:"<p>Votre message n'a pas d'<b>objet</b>. L'objet aide votre correspondant à savoir tout de suite de quoi parle le message.</p><p>Voulez-vous l'envoyer quand même ?</p>",buttons:[{label:'Envoyer sans objet',value:true},{label:'Ajouter un objet',value:false,primary:true}]});if(!r){$('#cSub')&&$('#cSub').focus();return}}
 const m={id:S.nextId++,folder:'sent',from:{name:S.user.name,email:S.user.email},to,cc,bcc,subject:C.subject.trim(),text:C.text,date:Date.now(),read:true,starred:false,attachments:C.atts};
 const info={kind:C.kind,src:C.src!=null?byId(C.src):null,to,cc,bcc,subject:m.subject,atts:(C.atts||[]).length};
 if(C.draftId)S.messages=S.messages.filter(x=>x.id!==C.draftId);
 S.messages.push(m);C=null;renderCompose();save();render();
 toast('Message envoyé ✔',{label:'Voir',fn:()=>{V.folder='sent';V.q='';$('#q').value='';V.checked.clear();openMsg(m.id)}});
 simulate(m);
 onSent(info);
}
function saveDraft(silent){
 readFields();
 const d={folder:'drafts',from:{name:S.user.name,email:S.user.email},to:splitAddr(C.to),cc:splitAddr(C.cc),bcc:splitAddr(C.bcc),subject:C.subject,text:C.text,date:Date.now(),read:true,starred:false,attachments:C.atts.map(a=>Object.assign({},a))};
 const x=C.draftId&&byId(C.draftId);
 if(x)Object.assign(x,d);else{d.id=S.nextId++;S.messages.push(d);C.draftId=d.id}
 C.dirty=false;save();render();if(!silent)toast('Brouillon enregistré dans « Brouillons »');
}
async function closeCompose(){
 readFields();
 if(C.dirty){
  const r=await dialog({title:'Fermer le message ?',body:"<p>Vous n'avez pas envoyé ce message. Que voulez-vous faire ?</p>",buttons:[{label:'Continuer à écrire',value:'stay'},{label:'Supprimer',value:'del',danger:true},{label:'Enregistrer le brouillon',value:'save',primary:true}]});
  if(!r||r==='stay')return;
  if(r==='save')saveDraft(false);
  if(r==='del'&&C.draftId){const x=byId(C.draftId);if(x){x.prev='drafts';x.folder='trash'}save();render()}
 }
 C=null;renderCompose();
}
async function discardCompose(){
 const r=await dialog({title:'Supprimer ce message ?',body:"<p>Le message en cours d'écriture sera supprimé.</p>",buttons:[{label:'Annuler',value:false},{label:'Supprimer',value:true,danger:true}]});
 if(!r)return;
 if(C.draftId){const x=byId(C.draftId);if(x){x.prev='drafts';x.folder='trash'}save();render()}
 C=null;renderCompose();toast('Message supprimé');
}

/* ---------- simulation of replies ---------- */
function classify(a){
 const mm=me();if(a===mm)return{type:'self'};
 const c=contactOf(a);if(c)return c.sim?{type:'contact',c}:{type:'external'};
 let best=null,bd=99;for(const x of [...S.contacts.map(c=>c.email.toLowerCase()),mm]){const d=lev(a,x);if(d<bd){bd=d;best=x}}
 if(bd<=3)return{type:'bounce',suggest:best};
 const dom=a.split('@')[1]||'';const known=[...new Set([DOMAIN,...S.contacts.map(c=>c.email.split('@')[1].toLowerCase())])];
 if(!known.includes(dom)&&known.some(k=>lev(dom,k)<=2))return{type:'bounce',suggest:null};
 return{type:'external'};
}
function deliver(ref,o){
 if(S!==ref)return;
 const m=Object.assign({id:S.nextId++,folder:'inbox',to:[S.user.email],cc:[],bcc:[],read:false,starred:false,attachments:[],date:Date.now()},o);
 S.messages.push(m);save();render();
 toast(`📩 Nouveau message de <b>${esc(m.from.name||m.from.email)}</b>`,{label:'Lire',fn:()=>{V.folder='inbox';V.q='';$('#q').value='';V.checked.clear();openMsg(m.id)}});
}
function makeReply(c,sent){
 const first=S.user.first;
 if(c.auto)return{from:{name:c.name,email:c.email},subject:'Réponse automatique : '+(sent.subject||'(sans objet)'),text:c.auto};
 const v=!!c.vous,hasAtt=sent.attachments.length>0,mentions=/pi[eè]ces?\s+jointes?|ci-joint|\bpj\b/i.test(sent.text);
 const L=[`${c.hello||'Bonjour'} ${first}${c.hello==='Coucou'?' !':','}`,''];
 L.push(v?`Merci pour votre message${sent.subject?` « ${sent.subject} »`:''}, je l'ai bien reçu.`:`Merci pour ton message${sent.subject?` « ${sent.subject} »`:''}, je l'ai bien reçu !`);
 if(!sent.subject)L.push(v?"Petite remarque : votre message n'avait pas d'objet. Pensez à en mettre un, cela aide à s'y retrouver.":"Petite remarque : ton message n'avait pas d'objet. Pense à en mettre un, ça aide à s'y retrouver 😉");
 if(hasAtt){const n=sent.attachments.length;L.push(`J'ai bien reçu ${n>1?`les ${n} pièces jointes`:'la pièce jointe'} (${sent.attachments.map(a=>a.name).join(', ')}). Merci !`)}
 else if(mentions)L.push(v?"Vous parlez d'une pièce jointe, mais je ne vois aucun fichier attaché au message. Vous avez peut-être oublié de le joindre ?":"Tu parles d'une pièce jointe, mais je ne vois aucun fichier attaché au message. Tu as peut-être oublié de le joindre ?");
 if(sent.cc.length)L.push(v?`(Je vois que vous avez mis ${sent.cc.map(nameOf).join(', ')} en copie.)`:`(Je vois que tu as mis ${sent.cc.map(nameOf).join(', ')} en copie.)`);
 L.push('',c.sign);
 return{from:{name:c.name,email:c.email},subject:prefix('RE',sent.subject||'(sans objet)'),text:L.join('\n')+quote(sent)};
}
function simulate(m){
 const ref=S,seen=new Set();let delay=5000;
 const toL=m.to.map(a=>a.toLowerCase());
 [...m.to,...m.cc,...(m.bcc||[])].forEach(raw=>{
  const a=raw.toLowerCase();if(seen.has(a))return;seen.add(a);
  const k=classify(a);
  if(k.type==='self'&&!seen.has('#self')){seen.add('#self');setTimeout(()=>deliver(ref,{from:m.from,to:m.to.slice(),cc:m.cc.slice(),subject:m.subject,text:m.text,attachments:m.attachments.map(x=>Object.assign({},x))}),2500)}
  else if(k.type==='contact'&&toL.includes(a)){const c=k.c;delay+=2500+Math.random()*3000;setTimeout(()=>deliver(ref,makeReply(c,m)),delay)}
  else if(k.type==='bounce'){setTimeout(()=>deliver(ref,{bounce:true,from:{name:'Service de messagerie',email:'mailer-daemon@'+DOMAIN},subject:'Message non distribué : '+(m.subject||'(sans objet)'),
   text:`Votre message n'a pas pu être distribué à l'adresse suivante :\n\n      ${raw}\n\nCette adresse n'existe pas ou elle est mal écrite.${k.suggest?`\n\nVouliez-vous dire :  ${k.suggest}  ?`:''}\n\nConseil : vérifiez chaque lettre de l'adresse, puis renvoyez votre message. Vous le retrouverez dans le dossier « Envoyés » (bouton « Transférer »).`,
   legit:"C'est un message automatique de votre messagerie : il vous prévient qu'une adresse était mal écrite. Il est fiable."}),3500)}
 });
}

/* ---------- contacts ---------- */
async function contactDialog(c){
 const isEdit=!!(c&&contactOf(c.email)&&c.edit);
 const r=await dialog({title:isEdit?'Modifier le contact':'Ajouter un contact',body:`<label for="cn">Nom</label><input class="field" id="cn" name="cn" value="${esc(c&&c.name||'')}" placeholder="Ex. : Jeanne Durand"><label for="ce">Adresse e-mail</label><input class="field" id="ce" name="ce" value="${esc(c&&c.email||'')}" placeholder="Ex. : jeanne.durand@cocotte-mail.fr" spellcheck="false">`,buttons:[{label:'Annuler',value:false},{label:'Enregistrer',value:true,primary:true}]});
 if(!r)return;
 const name=(dialog.vals.cn||'').trim(),email=(dialog.vals.ce||'').trim();
 if(!validAddr(email)){await dialog({title:'Adresse incorrecte',body:`<p>« ${esc(email)} » n'est pas une adresse valide : ${badReason(email)}.</p>`});return contactDialog({name,email,edit:isEdit,orig:c&&c.orig})}
 const orig=isEdit?(c.orig||c.email):null;
 const dup=contactOf(email);
 if(dup&&(!orig||dup.email.toLowerCase()!==orig.toLowerCase())){toast('Ce contact existe déjà');return}
 if(isEdit){const x=contactOf(orig);x.name=name||email;x.email=email;V.contact=email}
 else{S.contacts.push({name:name||email,email});if(V.folder==='contacts')V.contact=email}
 save();render();toast(isEdit?'Contact modifié':`${esc(name||email)} a été ajouté à vos contacts`);
}

async function exDialog(n){
 const x=EX[n-1];if(!x)return;const done=S.ex&&S.ex[n];
 const r=await dialog({title:`Exercice ${n} / 5 : ${esc(x.t)}`,wide:true,body:(done?`<p class="okbox">✔ Exercice réussi !</p>`:'')+x.d+`<p class="mut">💡 ${x.tip}</p>`,buttons:[{label:'Fermer',value:false},{label:n===5?'Ouvrir la sécurité du compte':'Aller au message',value:'go',primary:true}]});
 if(r!=='go')return;
 if(n===5){securityDialog();return}

  case 'fs-':S.fs=Math.max(14,(S.fs||17)-1);applyFs();save();break;
  case 'fs+':S.fs=Math.min(24,(S.fs||17)+1);applyFs();save();break;
  case 'addcontact':contactDialog();break;
  case 'addsender':m&&contactDialog({name:m.from.name,email:m.from.email});break;
  case 'writecontact':{const c=contactOf(V.contact);c&&openCompose({to:c.email+', '});break}
  case 'editcontact':{const c=contactOf(V.contact);c&&contactDialog({name:c.name,email:c.email,edit:true,orig:c.email});break}
  case 'delcontact':{const c=contactOf(V.contact);if(!c)break;const ok=await dialog({title:'Supprimer ce contact ?',body:`<p>${esc(c.name)} (${esc(c.email)}) sera retiré de vos contacts. Les messages ne sont pas supprimés.</p>`,buttons:[{label:'Annuler',value:false},{label:'Supprimer',value:true,danger:true}]});if(ok){S.contacts=S.contacts.filter(x=>x!==c);V.contact=null;document.body.classList.remove('reading');save();render();toast('Contact supprimé')}break}
 }
});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.matches&&e.target.matches('.row[data-id],.row[data-contact]')){e.preventDefault();e.target.click()}
});
// link hover → status bar
const status=$('#status');
document.addEventListener('mouseover',e=>{const a=e.target.closest&&e.target.closest('.mbody a[data-url]');if(a){status.textContent=a.dataset.url;status.style.display='block'}});
document.addEventListener('mouseout',e=>{const a=e.target.closest&&e.target.closest('.mbody a[data-url]');if(a&&!a.contains(e.relatedTarget))status.style.display='none'});
let qT;$('#q').addEventListener('input',e=>{clearTimeout(qT);qT=setTimeout(()=>{V.q=e.target.value.trim();V.checked.clear();if(V.folder==='contacts')V.folder='inbox';renderList();renderSide()},150)});

/* ---------- page « Présentation de la séance » (#seance) ---------- */
const SEANCE_OBJ=[['inbox','Retrouver un message dans les dossiers'],['reply','Lire un mail, répondre et répondre à tous'],['users','Écrire un mail avec une copie ou une copie cachée'],['clip','Ouvrir et envoyer une pièce jointe'],['forward','Transférer un mail']];
const SEANCE_STEPS=[['Accueil',10,''],['Je découvre ma messagerie',15,'Mission 1'],['Je lis, je réponds, j\'écris',30,'Missions 2, 3 et 4'],['Pause',10,'',true],['Les pièces jointes',20,'Missions 5 et 6'],['Copie cachée et transfert',15,'Missions 7 et 8'],['Défi final',10,'🏁 Sans aide'],['Bilan',10,'']];
const SKEY='cocotte-mail-seance-etape';
function seanceStep(){const n=parseInt(localStorage.getItem(SKEY),10);return isNaN(n)?-1:Math.max(-1,Math.min(SEANCE_STEPS.length-1,n))}
function renderSeance(){
 let el=document.getElementById('seance');
 if(location.hash!=='#seance'){if(el)el.remove();return}
 if(!el){el=document.createElement('div');el.id='seance';el.className='seance';document.body.appendChild(el)}
 const cur=seanceStep();
 el.innerHTML=`<div class="s-top"><span class="logo">${ic('mail')}</span><div><h1>Atelier : gérer ses mails</h1><p class="s-goal">Objectif : échanger par mail avec aisance, comme par SMS.</p></div><div class="s-foot"><button class="btn" data-s="prev">◀ Étape précédente</button><button class="btn" data-s="next">Étape suivante ▶</button><button class="btn primary" data-s="open">${ic('mail')} Ouvrir la messagerie</button></div></div>
 <div class="s-main"><section><h2>Aujourd'hui, je vais apprendre à :</h2><ul class="s-obj">${SEANCE_OBJ.map(([i,t])=>`<li>${ic(i)}<span>${t}</span></li>`).join('')}</ul></section>
 <section><h2>Le déroulé de la séance (2h)</h2><ol class="s-steps">${SEANCE_STEPS.map(([t,d,m,p],i)=>`<li class="${p?'pause ':''}${i<cur?'done':i===cur?'cur':''}"><span class="n">${i<cur?'✔':i+1}</span><span>${t}${m?`<small>${m}</small>`:''}</span><span class="d">${d} min</span></li>`).join('')}</ol></section></div>`;
}
function seanceMove(d){const n=Math.max(-1,Math.min(SEANCE_STEPS.length-1,seanceStep()+d));try{localStorage.setItem(SKEY,String(n))}catch(e){}renderSeance()}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-s]');if(!b||!document.getElementById('seance'))return;e.stopPropagation();const k=b.dataset.s;if(k==='prev')seanceMove(-1);else if(k==='next')seanceMove(1);else if(k==='open'){history.replaceState(null,'',location.pathname+location.search);renderSeance()}},true);
document.addEventListener('keydown',e=>{if(!document.getElementById('seance'))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();seanceMove(1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();seanceMove(-1)}});
window.addEventListener('hashchange',renderSeance);

/* ---------- start ---------- */
$('#menuBtn').innerHTML=ic('menu');$('#logo').innerHTML=ic('mail');$('#searchIc').innerHTML=ic('search');
$('#helpBtn').innerHTML=ic('help')+'<span class="lbl">Lexique</span>';$('#setBtn').innerHTML=ic('gear')+'<span class="lbl">Paramètres</span>';
load();
if(S){applyFs();render()}else onboarding();
renderSeance();
})();
</script>
